name: Book Visualizer bug
description: Report a Book Visualizer installation, language, content, or output problem
title: "[book] "
body:
  - type: input
    id: version
    attributes:
      label: Plugin version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Host and version
      placeholder: "Claude Code / Codex / other"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Invocation and steps to reproduce
      description: Include the command or skill name and a public book title. Remove private uploads, credentials, and personal information.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and relevant error
    validations:
      required: true
